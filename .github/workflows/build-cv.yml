name: Build CV

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [content.json, scripts/build_cv.py, fonts/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install reportlab
      - run: curl -fsSL https://raw.githubusercontent.com/ashm-dev/ashm-dev/main/contributions.json -o contributions.json
      - run: python3 scripts/build_cv.py contributions.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv-en.pdf cv-ru.pdf
          git diff --cached --quiet && exit 0
          git commit -m "chore(cv): rebuild PDF"
          git push
